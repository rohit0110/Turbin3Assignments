[workspace]

[package]
name = "stablecoin-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"

# Deliberately its own standalone crate, outside the `assignment4` Anchor
# workspace: it drives the deployed program over RPC and has no business
# being pulled into the on-chain (sbf) build.

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
stablecoin = { path = "../programs/stablecoin" }
anchor-lang = "1.1.2"
solana-client = "3"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-signature = "3"
solana-pubkey = "3"
solana-message = "3.1.0"
solana-transaction = "3.1.0"
solana-commitment-config = "3"
spl-token-2022-interface = "3.1.1"
spl-associated-token-account-interface = "2.0.0"
spl-pod = "0.7.4"
solana-zk-sdk = "7.0.1"
solana-zk-sdk-pod = "0.1.2"
solana-zk-elgamal-proof-interface = "0.1.3"
spl-token-confidential-transfer-proof-generation = "0.6.1"
spl-record = "0.4.0"
solana-compute-budget-interface = "3.1.0"
bytemuck = "1.25.2"
